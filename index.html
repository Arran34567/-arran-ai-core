<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arran AI Core - พี่น้องไม่ทิ้งกัน</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #0f172a; color: #f8fafc; }
  .container { max-width: 560px; margin: 0 auto; padding: 16px; }
  .header h2 { margin: 0 0 8px; font-size: 20px; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: bold; background: #334155; }
  .chat-box { height: 280px; overflow-y: auto; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin: 12px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg-user { background: #3b82f6; color: #fff; align-self: flex-end; }
  .msg-ai { background: #334155; align-self: flex-start; }
  .msg-error { color: #f87171; }
  .input-row { display: flex; gap: 8px; }
  #user-input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 15px; }
  #sendBtn { padding: 10px 18px; border-radius: 10px; border: none; background: #3b82f6; color: #fff; font-size: 15px; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>Arran AI Core - พี่น้องไม่ทิ้งกัน</h2>
    <span class="status-badge" id="statusBadge">● ออนไลน์</span>
  </div>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-row">
    <input id="user-input" type="text" placeholder="พิมพ์ข้อความ...">
    <button id="sendBtn">ส่ง</button>
  </div>
</div>
<script>
var PRICES = { "เสื้อ": 350, "กางเกง": 490, "หมวก": 190, "เซ็ต": 990 };

function priceList() {
  return "ราคาสินค้า Arran Shop ครับพี่ 👕\n• เสื้อ 350 บาท\n• กางเกง 490 บาท\n• หมวก 190 บาท\n• เซ็ต 3 ชิ้น 990 บาท\n• ค่าส่ง 50 บาท สั่งครบ 1,000 ส่งฟรีครับ\nพิมพ์คำว่า สั่งซื้อ ได้เลยครับ";
}

function orderSummary(m) {
  var item = null;
  if (m.indexOf("เสื้อ") !== -1) item = "เสื้อ";
  else if (m.indexOf("กางเกง") !== -1) item = "กางเกง";
  else if (m.indexOf("หมวก") !== -1) item = "หมวก";
  else if (m.indexOf("เซ็ต") !== -1 || m.indexOf("เซต") !== -1 || m.indexOf("ชุด") !== -1) item = "เซ็ต";
  if (!item) return null;
  var num = m.match(/(\d+)/);
  if (!num) return null;
  var qty = parseInt(num[1], 10);
  var total = qty * PRICES[item];
  var ship = total >= 1000 ? 0 : 50;
  var grand = total + ship;
  return "สรุปออเดอร์ครับพี่ 🛒\n• " + item + " " + qty + " ชิ้น = " + total + " บาท\n• ค่าส่ง " + ship + " บาท" + (ship === 0 ? " (ส่งฟรีครับ 🎉)" : "") + "\n• ยอดรวม " + grand + " บาทครับ\n\nถ้าถูกต้อง พิมพ์ชื่อ + ที่อยู่จัดส่งมาได้เลยครับ";
}

function smartReply(msg) {
  var m = msg.toLowerCase();
  var order = orderSummary(m);
  if (order) return order;
  if (m.indexOf("สวัสดี") !== -1 || m.indexOf("หวัดดี") !== -1 || m.indexOf("ฮัลโหล") !== -1 || m.indexOf("hello") !== -1) {
    return "สวัสดีครับพี่ 🙏 ยินดีต้อนรับสู่ Arran AI Core ครับ พี่อยากคุยเล่น หรืออยากดูสินค้าร้าน Arran Shop ดีครับ? พิมพ์คำว่า ราคา ได้เลยครับ";
  }
  if (m.indexOf("ราคา") !== -1 || m.indexOf("เสื้อ") !== -1 || m.indexOf("กางเกง") !== -1 || m.indexOf("หมวก") !== -1 || m.indexOf("ชุด") !== -1 || m.indexOf("สินค้า") !== -1) {
    return priceList();
  }
  if (m.indexOf("สั่ง") !== -1 || m.indexOf("ซื้อ") !== -1) {
    return "รับทราบครับพี่ 🛒 พี่พิมพ์ชื่อสินค้าที่ต้องการได้เลยครับ เช่น เสื้อ หรือ เซ็ต 3 ชิ้น แล้วผมจะสรุปยอดให้ครับ";
  }
  if (m.indexOf("ส่ง") !== -1 || m.indexOf("ค่าส่ง") !== -1 || m.indexOf("จัดส่ง") !== -1) {
    return "ค่าส่ง 50 บาทครับพี่ สั่งครบ 1,000 บาทส่งฟรีครับ 📦";
  }
  if (m.indexOf("ขอบคุณ") !== -1 || m.indexOf("ขอบใจ") !== -1) {
    return "ยินดีครับพี่ ❤ พี่น้องไม่ทิ้งกัน มีอะไรให้ช่วยอีกพิมพ์มาได้เลยครับ";
  }
  if (m.indexOf("อารัญ") !== -1 || m.indexOf("เจ้าของ") !== -1 || m.indexOf("ใคร") !== -1) {
    return "ร้านนี้ของพี่อารัญ คหาปนะ ครับ 😊 Arran AI Core สร้างมาเพื่อให้พี่น้องได้คุยกัน พี่น้องไม่ทิ้งกันครับ";
  }
  return "รับทราบครับพี่: " + msg + " — พี่อยากคุยเล่น หรืออยากดู ราคา สินค้า ดีครับ? พิมพ์คำว่า ราคา ได้เลยครับ";
}

function addMsg(text, cls) {
  var box = document.getElementById("chatBox");
  var div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  var inputEl = document.getElementById("user-input");
  var text = inputEl.value.trim();
  if (!text) return;
  addMsg(text, "msg-user");
  inputEl.value = "";
  try { addMsg(smartReply(text), "msg-ai"); }
  catch (e) { addMsg("ส่งข้อความไม่สำเร็จครับ", "msg-ai msg-error"); }
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("user-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") sendMessage();
});

addMsg("สวัสดีครับพี่อารัญ พิมพ์ข้อความทดสอบระบบได้เลยครับ", "msg-ai");

function checkStatus() {
  try {
    fetch("https://arran-backend.onrender.com/health")
      .then(function (r) { if (r.ok) document.getElementById("statusBadge").textContent = "● ออนไลน์ (ok)"; })
      .catch(function () {});
  } catch (e) {}
}
checkStatus();
</script>
</body>
</html>
