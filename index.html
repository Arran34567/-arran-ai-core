<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arran AI Core</title>
  <style>
    body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
    .container { background-color: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 450px; width: 100%; }
    .header { text-align: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 16px; }
    .header h2 { margin: 0 0 8px 0; font-size: 20px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: bold; background-color: #334155; }
    .chat-box { height: 280px; overflow-y: auto; background-color: #0f172a; border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg-user { background-color: #3b82f6; color: white; align-self: flex-end; }
    .msg-ai { background-color: #334155; color: #f8fafc; align-self: flex-start; }
    .msg-error { color: #f87171; }
    .input-group { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 16px; outline: none; }
    button { background-color: #3b82f6; color: white; border: none; padding: 0 18px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:active { background-color: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2 id="core-message">กำลังเชื่อมต่อ...</h2>
      <div id="api-status" class="status-badge">กำลังตรวจสอบสถานะ...</div>
    </div>
    <div id="chat-box" class="chat-box">
      <div class="msg msg-ai">สวัสดีครับพี่อารัญ พิมพ์ข้อความทดสอบระบบได้เลยครับ</div>
    </div>
    <div class="input-group">
      <input type="text" id="user-input" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">ส่ง</button>
    </div>
  </div>
  <script>
    const API_URL = "https://arran-backend.onrender.com";
    function addMsg(text, cls) {
      const chatBox = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    async function checkStatus() {
      const msgEl = document.getElementById("core-message");
      const statusEl = document.getElementById("api-status");
      try {
        const res = await fetch(`${API_URL}/`);
        const data = await res.json();
        msgEl.innerText = data.message;
        statusEl.innerText = `● ออนไลน์ (${data.status})`;
        statusEl.style.color = "#4ade80";
      } catch (err) {
        msgEl.innerText = "Arran AI Core";
        statusEl.innerText = "● ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";
        statusEl.style.color = "#f87171";
      }
    }    function smartReply(msg) {
      var m = msg.toLowerCase();      // รับออเดอร์ + คิดยอดเอง
      var orderMatch = m.match(/(เสื้อ|กางเกง|หมวก|เซ็ต|ชุด)\s*(\d+)/);
      if (orderMatch) {
        var prices = { "เสื้อ": 350, "กางเกง": 490, "หมวก": 190, "เซ็ต": 990, "ชุด": 990 };
        var item = orderMatch[1];
        var qty = parseInt(orderMatch[2], 10);
        var total = prices[item] * qty;
        var ship = total >= 1000 ? 0 : 50;
        var grand = total + ship;
        return "สรุปออเดอร์ครับพี่ 🛒\n• " + item + " " + qty + " ชิ้น = " + total + " บาท\n• ค่าส่ง " + ship + " บาท" + (ship === 0 ? " (ส่งฟรีครับ 🎉)" : "") + "\n• ยอดรวม " + grand + " บาทครับ\n\nถ้าถูกต้อง พิมพ์ชื่อ + ที่อยู่จัดส่งมาได้เลยครับ";
      }
      if (m.includes("สวัสดี") || m.includes("หวัดดี") || m.includes("ฮัลโหล") || m.includes("hello")) {
        return "สวัสดีครับพี่ 🙏 ยินดีต้อนรับสู่ Arran AI Core ครับ พี่อยากคุยเล่น หรืออยากดูสินค้าร้าน Arran Shop ดีครับ? พิมพ์คำว่า ราคา ได้เลยครับ";
      }
      if (m.includes("ราคา") || m.includes("เสื้อ") || m.includes("กางเกง") || m.includes("หมวก") || m.includes("ชุด") || m.includes("สินค้า")) {
        return "ราคาสินค้า Arran Shop ครับพี่ 👕\n• เสื้อ 350 บาท\n• กางเกง 490 บาท\n• หมวก 190 บาท\n• เซ็ต 3 ชิ้น 990 บาท\n• ค่าส่ง 50 บาท สั่งครบ 1,000 ส่งฟรีครับ\nพิมพ์คำว่า สั่งซื้อ ได้เลยครับ";
      }
      if (m.includes("สั่ง") || m.includes("ซื้อ")) {
        return "รับทราบครับพี่ 🛒 พี่พิมพ์ชื่อสินค้าที่ต้องการได้เลยครับ เช่น เสื้อ หรือ เซ็ต 3 ชิ้น แล้วผมจะสรุปยอดให้ครับ";
      }
      if (m.includes("ส่ง") || m.includes("ค่าส่ง") || m.includes("จัดส่ง")) {
        return "ค่าส่ง 50 บาทครับพี่ สั่งครบ 1,000 บาทส่งฟรีครับ 📦";
      }
      if (m.includes("ขอบคุณ") || m.includes("ขอบใจ")) {
        return "ยินดีครับพี่ ❤️ พี่น้องไม่ทิ้งกัน มีอะไรให้ช่วยอีกพิมพ์มาได้เลยครับ";
      }
      if (m.includes("อารัญ") || m.includes("เจ้าของ") || m.includes("ใคร")) {
        return "ร้านนี้ของพี่อารัญ คหาปนะ ครับ 😊 Arran AI Core สร้างมาเพื่อให้พี่น้องได้คุยกัน พี่น้องไม่ทิ้งกันครับ";
      }
      return "รับทราบครับพี่: " + msg + " — พี่อยากคุยเล่น หรืออยากดู ราคา สินค้า ดีครับ? พิมพ์คำว่า ราคา ได้เลยครับ";
    }
    async function sendMessage() {
      const inputEl = document.getElementById("user-input");
      const text = inputEl.value.trim();
      if (!text) return;
      addMsg(text, "msg-user");
      inputEl.value = "";
      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
             addMsg(smartReply(text), "msg-ai");   
      } catch (err) {
        addMsg("ส่งข้อความไม่สำเร็จครับ", "msg-ai msg-error");
      }
    }
    checkStatus();
  </script>
</body>
</html>
